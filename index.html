<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Elite NEET PG 2026 Overlay</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Orbitron:wght@500;700&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root { 
            --elite-gold: #c5a059; 
            --dark-gold: #8e6d2f; 
            --cream-bg: rgba(255, 253, 245, 0.98);
            --medical-blue: #1a2a3a;
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { height: 100vh; font-family: 'Montserrat', sans-serif; background: transparent; overflow: hidden; color: var(--medical-blue); }

        .dashboard { display: grid; grid-template-columns: 260px 1fr 400px; grid-template-rows: auto auto 1fr auto; gap: 15px; padding: 25px; height: 100vh; }

        header, .dynamic-box, .session-box { 
            background: var(--cream-bg); 
            backdrop-filter: blur(10px); 
            border: 1.5px solid var(--elite-gold); 
            border-radius: 12px; 
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
        }

        header { grid-column: span 3; padding: 15px 35px; }
        .header-flex { display: flex; justify-content: space-between; align-items: center; }
        
        /* Font and Emoji Upgrades */
        h1 { font-family: 'Cinzel Decorative', serif; font-size: 42px; color: var(--dark-gold); }
        .digital-clock { font-family: 'Orbitron', sans-serif; font-size: 28px; color: var(--medical-blue); letter-spacing: 2px; }

        /* Marked Slider Bar */
        .slider-container { position: relative; width: 100%; margin-top: 20px; padding-bottom: 20px; }
        .slider-track { height: 10px; background: rgba(0,0,0,0.05); border-radius: 10px; position: relative; border: 1px solid rgba(197, 160, 89, 0.3); }
        #slider-thumb { position: absolute; height: 22px; width: 22px; background: var(--elite-gold); border: 3px solid #fff; border-radius: 50%; top: -7px; z-index: 5; }
        
        .markers { display: flex; justify-content: space-between; padding: 0 5px; margin-top: 5px; }
        .marker-tick { font-size: 10px; font-weight: 700; color: var(--dark-gold); position: relative; }
        .marker-tick::before { content: '|'; position: absolute; top: -15px; left: 50%; transform: translateX(-50%); color: var(--elite-gold); }

        /* Compact Session Box */
        .session-box { grid-column: 1; grid-row: 2; padding: 8px 12px; width: fit-content; height: fit-content; background: #fff; border: 2.5px solid var(--dark-gold); }
        .box-title { font-family: 'Cinzel Decorative', serif; font-size: 11px; color: var(--dark-gold); border-bottom: 1px solid var(--elite-gold); padding-bottom: 2px; margin-bottom: 5px; display: flex; justify-content: space-between; }
        #session-timer { font-family: 'Orbitron', sans-serif; font-size: 26px; text-align: center; }

        .dynamic-box { padding: 12px; height: fit-content; max-height: 100%; display: flex; flex-direction: column; }
        .scroll-area { overflow-y: auto; flex-grow: 1; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        td, th { padding: 10px 8px; border-bottom: 1px solid rgba(0,0,0,0.05); text-align: left; }
        .active-row { background: #fff !important; font-weight: 700; border-left: 6px solid var(--dark-gold); scale: 1.02; }

        /* Break Popup */
        #break-screen { 
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: #fffdf5; z-index: 10000; flex-direction: column; 
            justify-content: center; align-items: center; text-align: center; 
        }
        .break-gif { width: 320px; border-radius: 15px; margin: 20px 0; border: 2px solid var(--elite-gold); }
        #break-timer { font-family: 'Orbitron', sans-serif; font-size: 60px; color: var(--dark-gold); }

        footer { grid-column: span 3; text-align: right; font-size: 12px; font-weight: 600; color: var(--medical-blue); }
    </style>
</head>
<body>

    <div id="break-screen">
        <h1 style="font-family: 'Cinzel Decorative'; color: var(--dark-gold); font-size: 35px;">🩺 REST PHASE</h1>
        <img id="break-gif-img" src="" class="break-gif">
        <h2 id="break-msg-text" style="font-weight: 400;">Refueling for the next round.</h2>
        <div id="break-timer">00:00:00</div>
        <p style="font-size: 12px; color: var(--dark-gold); letter-spacing: 2px;">UNTIL NEXT SESSION BEGINS</p>
    </div>

    <div class="dashboard">
        <header>
            <div class="header-flex">
                <h1>🩺 NEET PG 2026</h1>
                <div class="digital-clock" id="main-clock">🕒 --:--:-- --</div>
                <div id="days-text" style="font-weight: 700; color: #b03a2e; font-size: 18px;">-- Days Left</div>
            </div>
            <div class="slider-container">
                <div class="slider-track"><div id="slider-thumb"></div></div>
                <div class="markers">
                    <span class="marker-tick">120</span>
                    <span class="marker-tick">110</span>
                    <span class="marker-tick">100</span>
                    <span class="marker-tick">90</span>
                    <span class="marker-tick">80</span>
                    <span class="marker-tick">70</span>
                    <span class="marker-tick">60</span>
                    <span class="marker-tick">50</span>
                    <span class="marker-tick">40</span>
                    <span class="marker-tick">30</span>
                    <span class="marker-tick">20</span>
                    <span class="marker-tick">10</span>
                    <span class="marker-tick">0</span>
                </div>
            </div>
        </header>

        <div class="session-box">
            <div class="box-title"><span>⏱️ CURRENT</span> <span id="active-session-id">#--</span></div>
            <div id="session-timer">00:00:00</div>
            <p style="font-size: 9px; text-align: center; color: var(--elite-gold); font-weight: 700;">SYNCED</p>
        </div>

        <div class="dynamic-box" style="grid-column: 3; grid-row: 2 / 4;">
            <div class="box-title" style="font-size: 14px;">📅 SCHEDULE (12H VIEW)</div>
            <div class="scroll-area"><table id="schedule-table">
                <thead><tr><th>ID</th><th>START</th><th>END</th></tr></thead>
                <tbody id="schedule-body"></tbody>
            </table></div>
        </div>

        <div class="dynamic-box" style="grid-column: 1; grid-row: 3;">
            <div class="box-title" style="font-size: 14px;">🎯 TARGETS</div>
            <div class="scroll-area" id="target-list"></div>
        </div>

        <footer><div id="motivation-quote">"The expert was once a beginner."</div></footer>
    </div>

    <script>
        const CSV_URL = "https://docs.google.com/spreadsheets/d/1q5H4GwTK4NTXD7KdUpNBlhhtrMUVJroW3b30AslL4HM/export?format=csv";
        let scheduleData = [];

        const breakContent = [
            { gif: "https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExNHJieHlzZ3E4Z3J0eW4zbmNxeXp5eHl6eHl6eHl6eHl6eHl6JnB0PWEmZGl2PTE2ODQ3OTM0NTA/3o7TKVUn7iM8FMEU24/giphy.gif", msg: "Will be back to study soon! Vo" },
            { gif: "https://media.giphy.com/media/l0O9zkX7N7P6iJ9O8/giphy.gif", msg: "Time to hydrate and stretch." },
            { gif: "https://media.giphy.com/media/3o7TKURv8N3F5H5B5C/giphy.gif", msg: "Rest your eyes, Doctor." }
        ];

        function parseUniversalTime(t) {
            if (!t) return null;
            const now = new Date();
            const timeStr = t.trim().toUpperCase();
            let hours, minutes;
            if (timeStr.includes("AM") || timeStr.includes("PM")) {
                const match = timeStr.match(/(\d+):(\d+)\s*(AM|PM)?/);
                if (!match) return null;
                hours = parseInt(match[1]); minutes = parseInt(match[2]);
                if (match[3] === 'PM' && hours < 12) hours += 12;
                if (match[3] === 'AM' && hours === 12) hours = 0;
            } else {
                const match = timeStr.match(/(\d+):(\d+)/);
                if (!match) return null;
                hours = parseInt(match[1]); minutes = parseInt(match[2]);
            }
            return new Date(now.getFullYear(), now.getMonth(), now.getDate(), hours, minutes, 0);
        }

        async function fetchSheet() {
            try {
                const res = await fetch(CSV_URL);
                const text = await res.text();
                scheduleData = text.split('\n').map(r => r.split(',')).slice(1);
                renderUI();
            } catch(e) { console.error("Sync Failure"); }
        }

        function renderUI() {
            const tbody = document.getElementById('schedule-body');
            const tlist = document.getElementById('target-list');
            tbody.innerHTML = ""; tlist.innerHTML = "";
            scheduleData.forEach((row, i) => {
                if(!row[0] && !row[1]) return;
                const start = parseUniversalTime(row[1]);
                const end = parseUniversalTime(row[2]);
                tbody.innerHTML += `<tr id="row-${i}"><td>${row[0]}</td><td>${row[1]}</td><td>${row[2]}</td></tr>`;
                
                if(row[3]) {
                    // FIX: Direct reflection of sheet emoji
                    const emojiFromSheet = (row[4]||"").trim();
                    tlist.innerHTML += `<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid rgba(0,0,0,0.05);font-size:13px;"><span>${row[3]}</span><span>${emojiFromSheet}</span></div>`;
                }
            });
        }

        function engine() {
            const now = new Date();
            document.getElementById('main-clock').innerText = "🕒 " + now.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit', second:'2-digit', hour12: true});

            const targetDate = new Date("August 30, 2026");
            const daysLeft = Math.ceil((targetDate - now) / (1000 * 60 * 60 * 24));
            document.getElementById('days-text').innerText = `${daysLeft} Days Left`;
            document.getElementById('slider-thumb').style.left = `${Math.max(0, Math.min(100, ((120 - daysLeft) / 120) * 100))}%`;

            let activeFound = false;
            let currentIsBreak = false;
            let nextSession = null;

            // Logic fix: Find only ONE active session (the first match) to prevent combining 4 and 5
            for (let i = 0; i < scheduleData.length; i++) {
                const row = scheduleData[i];
                const start = parseUniversalTime(row[1]);
                const end = parseUniversalTime(row[2]);
                const rowEl = document.getElementById(`row-${i}`);

                if (start && end) {
                    if (now >= start && now <= end && !activeFound) {
                        activeFound = true;
                        if(row[0].toUpperCase().includes('BREAK')) currentIsBreak = true;
                        if(rowEl) rowEl.className = "active-row";
                        document.getElementById('active-session-id').innerText = row[0];
                        document.getElementById('session-timer').innerText = new Date(end - now).toISOString().substr(11, 8);
                    } else {
                        if(rowEl) rowEl.className = "";
                        if (start > now && (!nextSession || start < nextSession.start)) {
                            nextSession = { start, id: row[0] };
                        }
                    }
                }
            }

            const screen = document.getElementById('break-screen');
            if (!activeFound || currentIsBreak) {
                if(screen.style.display !== "flex") {
                    const content = breakContent[Math.floor(Math.random() * breakContent.length)];
                    document.getElementById('break-gif-img').src = content.gif;
                    document.getElementById('break-msg-text').innerText = content.msg;
                    screen.style.display = "flex";
                }
                if (nextSession) {
                    document.getElementById('break-timer').innerText = new Date(nextSession.start - now).toISOString().substr(11, 8);
                }
            } else {
                screen.style.display = "none";
            }
        }

        setInterval(engine, 1000);
        setInterval(fetchSheet, 60000);
        fetchSheet();
    </script>
</body>
</html>
